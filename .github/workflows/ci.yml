# 双平台 CI：macOS Apple Silicon + Windows x64（CLAUDE.md §2.2 的支持矩阵）。
#
# **Windows 那半是本项目第一次真跑。** README 与 doctor 都写着"从未在 Windows 上
# 跑过"，CI 正是要把这句话变成有据可查的结论——所以 Windows 上失败时
# **不要用 continue-on-error 把它糊过去**，那只会把"没验证过"伪装成"验证通过"。
# 真跑不起来就让它红着，并把原因记进契约。
#
# 仓库是私有的，这里**只产 artifact 与 draft release，不做任何自动公开**。
# 发布的最后一步（publish）永远是人手动按的。

name: CI

on:
  push:
    branches: [main]
    # 打 v* tag 触发发布链路：check → package → 建 draft release。
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: 出安装包（耗时约 10-20 分钟）
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读；只有建 release 的那个 job 单独提权到 contents: write。
permissions:
  contents: read

env:
  # 语言无关的稳定输出，便于比对日志
  PYTHONUTF8: '1'
  # 别让 uv 去猜网络代理下的镜像
  UV_NO_PROGRESS: '1'

jobs:
  check:
    name: 检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一端失败不取消另一端：Windows 挂了也要看到 macOS 的结果，
      # 反之亦然——否则"第一次在 Windows 上跑"这件事根本得不到数据。
      fail-fast: false
      matrix:
        # macos-14 起就是 Apple Silicon runner；写死具体版本而不是 macos-latest，
        # 免得哪天 latest 漂到别的架构上而我们毫无察觉。
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ffmpeg：CI 上不走应用的自动获取路径（那要联外网下几十 MB，
      # 而且 runner 上装什么与用户机器上装什么是两码事）。
      # 这里只是让 doctor 的 ffmpeg 检查有东西可查。
      # 注意 doctor 的判据是 **ass 滤镜注册没注册**，不是版本号。
      #
      # **macOS 必须装 ffmpeg-full，不能装主线 ffmpeg**——CLAUDE.md §2.4/§6.4 写着
      # 主线 formula 不含 libass，这条已由本 CI 亲自证实：runner 上装好 ffmpeg 8.1.2
      # 之后，一批依赖 `find_ffmpeg_with_libass()` 的用例全线报"找不到带 libass 的
      # ffmpeg"，brew 自己也在安装完成时提示 ffmpeg-full 才带全套。
      # ffmpeg-full 是 keg-only（不进 /opt/homebrew/bin），但 kvm.media.ffmpeg 的
      # CANDIDATES 里有 /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg，探测得到。
      - name: 安装 ffmpeg（macOS）
        if: runner.os == 'macOS'
        run: brew install ffmpeg-full
      - name: 安装 ffmpeg（Windows）
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full --no-progress -y

      - name: 安装 Python 依赖
        # --all-extras：doctor 与测试会探测各 extra 是否可用，缺了会得到一堆
        # "未安装"的警告而不是真实结论。
        run: uv sync --all-extras

      # 下面几步一律显式 `shell: bash`。Windows 的默认 shell 是 pwsh，多行 run 里
      # **只有最后一条命令的退出码决定成败**，前面的失败会被无声吃掉——
      # "前端 typecheck 挂了但 CI 绿着"正是这套门禁最不该出现的形态。
      # GitHub 的 bash 是 `bash -eo pipefail`，两端行为一致。
      - name: Ruff
        shell: bash
        run: uv run ruff check . && uv run ruff format --check .

      - name: pytest
        # 需要真实素材的用例会自己 skip（workspace/ 不随仓库分发，
        # CI 上也不该塞素材）。
        run: uv run pytest -q

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查 / lint / 构建
        working-directory: frontend
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: 环境自检 kvm.doctor
        # 自检本身就是产品功能（§2.6），它在 CI 上跑得起来是最低要求。
        # 用 --check-only 语义：这里只要它不崩，具体项的红黄由报告体现——
        # runner 上必然缺模型权重、缺字体，那是环境差异不是缺陷。
        env:
          PYTHONPATH: backend
        shell: bash
        run: uv run python -m kvm.doctor || echo "doctor 报告了不满足项（见上方报告）"

      # 外壳的 Rust 依赖有几百个 crate，不缓存的话每次都要从头编译十几分钟。
      # 显式钉 stable 工具链而不是用 runner 自带的那份，免得两端版本各飘各的。
      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 外壳 Rust 检查
        working-directory: src-tauri
        run: cargo check --locked

  package:
    name: 打包 (${{ matrix.plat }})
    # 两条触发路径：手动勾 package，或打了 v* tag。
    # PyInstaller + Tauri 一次十几分钟，不该挂在每个 PR 上。
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.package)
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            plat: macos-arm64
          - os: windows-latest
            plat: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        # shell: bash 的理由同 check job：pwsh 下多行 run 只看最后一条的退出码。
        shell: bash
        run: |
          uv sync --all-extras --group package
          npm ci
          npm ci --prefix frontend

      - name: 出包
        # 跨平台一条命令：脚本内部处理 npm.cmd / 路径分隔符等差异。
        run: uv run python scripts/package.py

      # 产物名要能一眼看出**平台与版本**。Tauri 出来的文件名只带 productName +
      # Cargo 版本号，认不出是哪台机器、哪个 tag 出的，所以在这里重命名一次。
      # 非 tag 触发（手动出包）标成 dev-<短 sha>，免得和真发布混淆。
      - name: 收拢并重命名产物
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
          else
            ver="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts
          shopt -s nullglob
          n=0
          for f in src-tauri/target/release/bundle/dmg/*.dmg \
                   src-tauri/target/release/bundle/nsis/*.exe \
                   src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "artifacts/kvm-${ver}-${{ matrix.plat }}.${f##*.}"
            n=$((n + 1))
          done
          if [[ $n -eq 0 ]]; then
            echo "::error::没有找到任何安装包，package.py 可能没走到出包这一步"
            ls -R src-tauri/target/release/bundle || true
            exit 1
          fi
          ls -lh artifacts

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 只收安装包，不收 onedir 目录（几 GB，artifact 存储扛不住）
          name: kvm-${{ steps.collect.outputs.version }}-${{ matrix.plat }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 建 draft release
    # 只有 tag 才走这一步。**两端都成功才建**：缺一个平台的 release 正是
    # 这套流程要避免的半真半假，Windows 挂了就先修 Windows，
    # 需要只发一端时手动下 artifact 自己建。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kvm-*
          merge-multiple: true

      - name: 建 draft release（**不 publish**）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
          echo "draft 已建好，去 Releases 页面确认后手动 publish。"
