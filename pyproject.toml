[project]
name = "karaoke-video-maker"
version = "0.1.0"
description = "一站式日式卡拉OK（ニコカラ）视频制作工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# 依赖刻意分组：核心出片链路很轻，重依赖（torch/librosa）只在需要时装。
# 见 CLAUDE.md §2.6 —— 应用最终要能自动获取这些，而不是要求用户手动安装。
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# HTTP API 层。此前各模块都靠 `uv run --with ...` 临时依赖验证，
# 导致后端进程实际起不来 —— 补齐后 `uv run uvicorn kvm.api.app:app` 才能跑。
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]
# 字体服务与预览字体子集化。brotli 供 woff2 读写；
# 注意产出给 libass 的字体必须是 OTF/TTF，woff2 只用于读取源文件。
fonts = [
    "fonttools>=4.55",
    "brotli>=1.1",
]
# 节拍检测与引导声。librosa 会拉入 numba/llvmlite，必须约束版本：
# 不约束时会解析到不兼容 Python 3.12 的 numba 0.53 并编译失败。
#
# torchcrepe 是引导声的音高提取后端（MIT）。选它而非 librosa 自带的 pyin，是因为
# pyin 是自相关域的**单音**跟踪器：本曲男女对唱的和声段它整段判无音高，基频弱时
# 还会锁到次谐波（实测把 415Hz 报成 103.8Hz，低两个八度）。CREPE 是波形上的 CNN，
# 不依赖自相关，且默认 Viterbi 解码会结构性排除倍频/半频错误。详见 guide_melody 模块文档。
# 权重（full 89MB / tiny 2MB）随 wheel 分发，无需运行时下载、无需联网。
# torch 本来就是本项目的既定依赖（人声分离与强制对齐），而引导声的输入正是分离产物，
# 所以这条不引入新的安装负担。
audio = [
    "librosa>=0.11",
    "numba>=0.61",
    "llvmlite>=0.44",
    "soundfile>=0.12",
    "torchcrepe>=0.0.23",
]
# 人声分离。audio-separator 不会自动带上 onnxruntime，必须显式声明。
separate = [
    "audio-separator>=0.44",
    "onnxruntime>=1.20",
]
download = [
    "yt-dlp>=2026.7",
]
lyrics = [
    "requests>=2.32",
    "pycryptodome>=3.20",
]

# 开发工具链（CLAUDE.md §11 命令表：ruff / pyright / pytest）。
# 用 PEP 735 `[dependency-groups]` 而不是 `[project.optional-dependencies]`：
# optional-dependencies 是给"安装本包的人"选装的功能特性（api/fonts/audio/...），
# 而 pytest/ruff/pyright 只是本仓库自己的开发工具，不该出现在发给用户的包元数据
# 的 extras 列表里，也不该能被 `pip install karaoke-video-maker[dev]` 装到别人的
# 环境中。这是 uv 当前推荐做法，`uv sync` 默认就会装上这个组，不需要额外参数。
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.380",
]
# 打包工具链。单独一组而不是塞进 dev：日常开发、CI 的 lint/test 都不需要它，
# 而 PyInstaller 只在出安装包时用一次。
package = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
# **必须显式限定收集范围。** 不限定时 pytest 会从仓库根往下走遍整棵树，
# 把打包产物里第三方库自带的测试也收进来——PyInstaller 的 `dist-backend/` 里
# 有一整份 PyTorch，它的 `torch/_dynamo/test_case.py` 之类依赖 `expecttest`
# 这种我们没装也不该装的东西，于是 52 个 collection error，**一条自己的测试都跑不到**。
# 那些目录已在 .gitignore 里，但 gitignore 不影响 pytest。
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
# 本项目不做 editable install，`kvm` 包靠 tests/*.py 开头手写的
# `sys.path.insert(0, backend)` 才能被导入（见 tests/test_importer.py 等）。
# pyright 不会执行那段运行时代码，不显式声明就会把每一个 `from kvm.xxx import ...`
# 报成 reportMissingImports——这不是真实的类型问题，只是没告诉它去哪儿找包。
extraPaths = ["backend"]
# workspace/ 是运行时产物/实验数据目录（.gitignore 已排除，CLAUDE.md 明确写它
# "不随仓库分发"），只在本机存在、别的检出/CI 上没有，把它纳入类型检查
# 只会得到一堆因环境而异、无法长期维护的错误，因此排除在外。
exclude = ["workspace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff 专有
    "PTH",       # 用 pathlib 而非 os.path
    # 下面两条是从 pep8-naming / flake8-pytest-style 里单挑出来的：整族启用会带进
    # 一堆与本项目风格冲突的规则（测试函数名是中文、fixture 命名等），而这两条本身
    # 已经零违规，且代码里各有一处**有意为之的例外**带着 `# noqa` 与中文理由。
    # 不启用的话那两处 noqa 会退化成 RUF100 死注释，例外的意图就无人守护了。
    "N818",      # 异常类名应以 Error 结尾（例外：JobCancelled 是控制流信号）
    "PT011",     # pytest.raises 不应过宽（例外：pydantic 抛 ValidationError，只能按 ValueError 接）
]
ignore = [
    # 本项目大量调用 ffmpeg/yt-dlp 等外部工具，命令由代码构造、不含用户输入拼接，
    # 逐处标注 check=False 与 S603 只会增加噪声而无安全收益
    "S603", "S607",
    # 中文注释与文档字符串里的全角标点会被误判为行宽问题，实际可读性没有问题
    "E501",
    # 实验脚本以 print 输出结论，这是它们的用途
    "T201",
    # 本项目的注释、文档字符串与错误信息一律用中文，全角标点是有意为之。
    # 这三条把全角冒号、括号等一律判为"可疑 Unicode"，在中文项目里全是误报。
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入**要求**把 Depends()/File()/Query() 写在参数默认值上——那正是
# B008 要拦的形状，但在 FastAPI 里它不是"可变默认值"陷阱，而是唯一的声明方式。
# 用 extend-immutable-calls 精确豁免这几个调用，而不是整条 ignore 掉 B008：
# 后者会连 `def f(x=list())` 这种真陷阱一起放过。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# 实验脚本是一次性验证代码，允许更松的写法。
# 追加 UP / E731 的理由：这些脚本大量是从参考实现（C# / Go / Python）逐段移植过来的，
# `%` 格式化与文件头的 `# -*- coding: utf-8 -*-` 都是移植时原样保留的痕迹。
# 它们的价值在于"能和上游逐行对照"，重写成 f-string 只会让对照变难，还平白引入
# 手抖改错常量的风险——而这些脚本正是 QRC 解密等结论的回归基线（CLAUDE.md §11）。
"experiments/**" = ["B", "SIM", "RUF", "UP", "E731"]

[tool.ruff.format]
quote-style = "double"
